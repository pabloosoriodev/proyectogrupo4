AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Comparador de precios (ADR-0009). Lambda de salud y su HTTP API (Sprint 0) y pipeline de
  scraping diario de HU-01: Scheduler -> orquestador -> cola SQS liviana -> scraper -> PostgreSQL,
  con una DLQ (ADR-0001, ADR-0011). Sin RDS: la base llega por parámetros.

Parameters:
  DbHost:
    Type: String
    Description: Host de PostgreSQL.
  DbPort:
    Type: String
    Description: Puerto de PostgreSQL.
  DbName:
    Type: String
    Description: Nombre de la base de datos.
  DbUser:
    Type: String
    Description: Usuario de la API en PostgreSQL.
  DbPassword:
    Type: String
    NoEcho: true
    Description: Contraseña del usuario de la API (en AWS vendrá de Parameter Store, ADR-0010).
  DbSsl:
    Type: String
    AllowedValues: ['true', 'false']
    Description: Si la conexión a PostgreSQL exige SSL (ADR-0003).
  DbConnectTimeoutMs:
    Type: String
    Description: Tiempo máximo para conectar y ejecutar la consulta de salud, en milisegundos.
  CorsAllowedOrigin:
    Type: String
    Description: Origen de la web autorizado por CORS.
  FunctionTimeoutSeconds:
    Type: Number
    Description: Timeout de la Lambda; debe superar DbConnectTimeoutMs.
  FunctionMemorySize:
    Type: Number
    Description: Memoria de la Lambda en MB.

  # --- HU-01: scraping diario ---
  Entorno:
    Type: String
    Description: Entorno (p. ej. dev, prod); arma el nombre /comparador/{entorno}/comercios (ADR-0010).
  ScrapingScheduleExpression:
    Type: String
    Default: cron(0 6 * * ? *)
    Description: Horario de la actualización diaria (RN-5, caso A3).
  ScrapingScheduleTimezone:
    Type: String
    Default: America/Lima
    Description: Zona horaria del horario (RN-5, caso A3).
  ScrapingMaxIntentos:
    Type: Number
    Default: 3
    Description: Intentos en total de cada petición de búsqueda (decisión 24, ADR-0011).
  ScrapingTimeoutMs:
    Type: Number
    Description: Tiempo máximo por petición a la web de un comercio, en ms.
  ScrapingUserAgent:
    Type: String
    Description: Cabecera User-Agent del scraper (caso D3).
  ScrapingQueueMaxReceiveCount:
    Type: Number
    Default: 3
    Description: Entregas de un mensaje antes de que SQS lo mueva a la DLQ (caso C7).
  ScrapingQueueVisibilityTimeoutSeconds:
    Type: Number
    Description: Visibilidad de los mensajes de la cola; debe superar ScraperFunctionTimeoutSeconds.
  ScrapingDlqRetentionSeconds:
    Type: Number
    Default: 1209600
    Description: Retención de la DLQ en segundos (14 días, caso C7).
  OrquestadorFunctionTimeoutSeconds:
    Type: Number
    Description: Timeout de la Lambda orquestadora.
  ScraperFunctionTimeoutSeconds:
    Type: Number
    Description: Timeout de la Lambda scraper (recorre todas las búsquedas de un comercio).

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Generado por `npm run build:api` (esbuild): handler + shared/ + pg + dotenv en un solo
      # archivo. SAM no resuelve las dependencias locales del monorepo (ADR-0012).
      CodeUri: dist/api
      Handler: health.handler
      Runtime: nodejs22.x
      Timeout: !Ref FunctionTimeoutSeconds
      MemorySize: !Ref FunctionMemorySize
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SSL: !Ref DbSsl
          DB_CONNECT_TIMEOUT_MS: !Ref DbConnectTimeoutMs
          CORS_ALLOWED_ORIGIN: !Ref CorsAllowedOrigin
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/health
            Method: GET

  # --- HU-01: scraping diario (ADR-0001, ADR-0011; decisiones 15 y 16) ---
  # Única DLQ del pipeline: la usan el scraper (comercio, url, motivo), la RedrivePolicy de la cola,
  # la invocación asíncrona del orquestador y el Scheduler.
  ScrapingDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: !Ref ScrapingDlqRetentionSeconds

  # Cola liviana (modo json). No hay cola ni Lambda browser (decisión 16).
  ScrapingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: !Ref ScrapingQueueVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScrapingDlq.Arn
        maxReceiveCount: !Ref ScrapingQueueMaxReceiveCount

  OrquestadorFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Generado por `npm run build:scraper` (esbuild).
      CodeUri: dist/scraper
      Handler: orquestador.handler
      Runtime: nodejs22.x
      Timeout: !Ref OrquestadorFunctionTimeoutSeconds
      MemorySize: !Ref FunctionMemorySize
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScrapingDlq.Arn
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SSL: !Ref DbSsl
          DB_CONNECT_TIMEOUT_MS: !Ref DbConnectTimeoutMs
          COMERCIOS_PARAMETER_NAME: !Sub '/comparador/${Entorno}/comercios'
          SCRAPING_QUEUE_URL: !Ref ScrapingQueue
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub 'comparador/${Entorno}/comercios'
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScrapingQueue.QueueName

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/scraper
      Handler: scraper.handler
      Runtime: nodejs22.x
      Timeout: !Ref ScraperFunctionTimeoutSeconds
      MemorySize: !Ref FunctionMemorySize
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SSL: !Ref DbSsl
          DB_CONNECT_TIMEOUT_MS: !Ref DbConnectTimeoutMs
          SCRAPING_MAX_INTENTOS: !Ref ScrapingMaxIntentos
          SCRAPING_TIMEOUT_MS: !Ref ScrapingTimeoutMs
          SCRAPING_USER_AGENT: !Ref ScrapingUserAgent
          SCRAPING_DLQ_URL: !Ref ScrapingDlq
      Policies:
        # El scraper publica él mismo la entrada de la DLQ (caso C3, decisión 15).
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScrapingDlq.QueueName
      Events:
        ScrapingQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ScrapingQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ScrapingSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvocarOrquestador
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt OrquestadorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScrapingDlq.Arn

  # Actualización diaria a las 06:00 de Lima (caso A3).
  ScrapingSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Ref ScrapingScheduleExpression
      ScheduleExpressionTimezone: !Ref ScrapingScheduleTimezone
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt OrquestadorFunction.Arn
        RoleArn: !GetAtt ScrapingSchedulerRole.Arn
        DeadLetterConfig:
          Arn: !GetAtt ScrapingDlq.Arn

Outputs:
  HttpApiUrl:
    Description: URL base de la HTTP API.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
